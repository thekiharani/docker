name: postgres

on:
  push:
    branches: [main]
    paths: [postgres.Dockerfile, .github/workflows/postgres.yml]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: postgres
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/thekiharani/postgres
  TAG: 18-trixie

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: postgres.Dockerfile
          platforms: linux/${{ matrix.arch }}
          pull: true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=postgres-${{ matrix.arch }}
          cache-to: type=gha,scope=postgres-${{ matrix.arch }},mode=max
      - run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        run: |
          tags="-t $IMAGE:latest -t $IMAGE:$TAG"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tags="$tags -t $IMAGE:$TAG-${GITHUB_SHA:0:7}"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - working-directory: /tmp/digests
        run: docker buildx imagetools create ${{ steps.tags.outputs.tags }} $(printf "$IMAGE@sha256:%s " *)
      - run: docker buildx imagetools inspect "$IMAGE:latest"
