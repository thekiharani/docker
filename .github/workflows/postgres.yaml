name: postgres

on:
  push:
    branches: [main]
    paths: [postgres.Dockerfile, .github/workflows/postgres.yaml]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if nothing upstream changed
        type: boolean
        default: false

concurrency:
  group: postgres
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/thekiharani/postgres
  MAJORS: "18 19"
  PGVECTOR_LABEL: com.github.thekiharani.pgvector.version

jobs:
  check:
    runs-on: ubuntu-26.04
    permissions:
      actions: write
      contents: write
      pull-requests: write
    outputs:
      majors: ${{ steps.decide.outputs.majors }}
      targets: ${{ steps.decide.outputs.targets }}
      sha_tag: ${{ steps.decide.outputs.sha_tag }}
      pgvector: ${{ steps.pgvector.outputs.pinned }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Scheduled workflows in public repos are disabled after 60 days without activity; enabling resets that.
      - run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/postgres.yaml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
      - id: pgvector
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "latest=$(gh api repos/pgvector/pgvector/tags --paginate --jq '.[].name' \
              | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' | sort -V | tail -1)"
            echo "pinned=$(sed -nE 's/^ARG PGVECTOR_VERSION=(.+)$/\1/p' postgres.Dockerfile)"
          } | tee -a "$GITHUB_OUTPUT"
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          FORCE: ${{ inputs.force }}
          LATEST: ${{ steps.pgvector.outputs.latest }}
          PINNED: ${{ steps.pgvector.outputs.pinned }}
        run: |
          sha_tag=false
          latest_major=$(printf '%s\n' $MAJORS | sort -n | tail -1)

          dockerfile_changed=false
          if [ "$EVENT" = push ]; then
            if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
              || ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- postgres.Dockerfile; then
              dockerfile_changed=true
              sha_tag=true
              echo "postgres.Dockerfile changed"
            fi
          fi

          if [ "$dockerfile_changed" = false ] && [ -n "$LATEST" ] \
            && [ "$(printf '%s\n%s\n' "$PINNED" "$LATEST" | sort -V | tail -1)" != "$PINNED" ]; then
            branch="pgvector-$LATEST"
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
              echo "pgvector $LATEST is out; its pull request is already open"
            else
              git switch -q -c "$branch"
              sha256=$(curl -fsSL --retry 3 "https://github.com/pgvector/pgvector/archive/refs/tags/v$LATEST.tar.gz" | sha256sum | cut -d' ' -f1)
              sed -i -E "s/^ARG PGVECTOR_VERSION=.+$/ARG PGVECTOR_VERSION=$LATEST/; s/^ARG PGVECTOR_SHA256=.+$/ARG PGVECTOR_SHA256=$sha256/" postgres.Dockerfile
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -qam "Bump pgvector to $LATEST"
              git push -q origin "$branch"
              gh pr create --base "$GITHUB_REF_NAME" --head "$branch" \
                --title "Bump pgvector to $LATEST" \
                --body "$(printf '%s\n' \
                  "pgvector $LATEST is out; this image carries $PINNED. The tarball's sha256 is $sha256." \
                  "Release notes: https://github.com/pgvector/pgvector/blob/master/CHANGELOG.md" \
                  "" \
                  "Merging builds and publishes \`$IMAGE\` for Postgres $MAJORS with it. Then pull it, recreate the container," \
                  "and in every database that has the extension, \`template1\` included, run:" \
                  "" \
                  "    ALTER EXTENSION vector UPDATE;")"
              git switch -q -
              echo "pgvector $PINNED -> $LATEST: opened a pull request"
            fi
          fi

          majors='[]'
          targets='{}'
          for major in $MAJORS; do
            base="postgres:$major-trixie"
            base_digest=$(docker buildx imagetools inspect "$base" --format '{{json .Manifest}}' | jq -r .digest)
            [ -n "$base_digest" ] || { echo "::error::$base not found"; exit 1; }
            published=$(docker buildx imagetools inspect "$IMAGE:$major-trixie" --format '{{json .Image}}' 2>/dev/null \
              | jq -c '."linux/amd64".config.Labels // {}' || echo '{}')
            published_base_digest=$(jq -r '."org.opencontainers.image.base.digest" // ""' <<< "$published")
            published_pgvector=$(jq -r --arg l "$PGVECTOR_LABEL" '.[$l] // ""' <<< "$published")

            build=$dockerfile_changed
            if [ "$dockerfile_changed" = false ]; then
              if [ "$base_digest" != "$published_base_digest" ]; then
                build=true
                echo "$major: base image changed: ${published_base_digest:-none} -> $base_digest"
              fi
              if [ "$PINNED" != "$published_pgvector" ]; then
                build=true
                echo "$major: published pgvector ${published_pgvector:-none} differs from $PINNED"
              fi
              if [ "$FORCE" = true ]; then
                build=true
                echo "$major: forced"
              fi
            fi

            echo "$major: build $build"
            if [ "$build" = true ]; then
              targets=$(jq -c --arg major "$major" --arg base "$base" --arg digest "$base_digest" \
                --argjson latest "$([ "$major" = "$latest_major" ] && echo true || echo false)" \
                '. + {($major): {base: $base, digest: $digest, latest: $latest}}' <<< "$targets")
              majors=$(jq -c --arg major "$major" '. + [$major]' <<< "$majors")
            fi
          done

          {
            echo "majors=$majors"
            echo "targets=$targets"
            echo "sha_tag=$sha_tag"
          } | tee -a "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.majors != '[]'
    strategy:
      fail-fast: false
      matrix:
        major: ${{ fromJSON(needs.check.outputs.majors) }}
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    env:
      BASE: ${{ fromJSON(needs.check.outputs.targets)[matrix.major].base }}
      BASE_DIGEST: ${{ fromJSON(needs.check.outputs.targets)[matrix.major].digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: postgres.Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            PG_MAJOR=${{ matrix.major }}
            PG_BASE=${{ env.BASE }}@${{ env.BASE_DIGEST }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.base.name=docker.io/library/${{ env.BASE }}
            org.opencontainers.image.base.digest=${{ env.BASE_DIGEST }}
            ${{ env.PGVECTOR_LABEL }}=${{ needs.check.outputs.pgvector }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=postgres-${{ matrix.major }}-${{ matrix.arch }}
          cache-to: type=gha,scope=postgres-${{ matrix.major }}-${{ matrix.arch }},mode=max
      - run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.major }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    needs: [check, build]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.check.outputs.majors != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        major: ${{ fromJSON(needs.check.outputs.majors) }}
    runs-on: ubuntu-26.04
    permissions:
      packages: write
    env:
      MAJOR: ${{ matrix.major }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.major }}-*
          path: /tmp/digests
          merge-multiple: true
      - working-directory: /tmp/digests
        run: |
          count=$(ls | wc -l)
          [ "$count" -eq 2 ] || { echo "::error::Postgres $MAJOR has $count of 2 platform builds"; exit 1; }
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        env:
          LATEST: ${{ fromJSON(needs.check.outputs.targets)[matrix.major].latest }}
          SHA_TAG: ${{ needs.check.outputs.sha_tag }}
        run: |
          tags="-t $IMAGE:$MAJOR-trixie"
          if [ "$LATEST" = true ]; then
            tags="$tags -t $IMAGE:latest"
          fi
          if [ "$SHA_TAG" = true ]; then
            tags="$tags -t $IMAGE:$MAJOR-trixie-${GITHUB_SHA:0:7}"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - working-directory: /tmp/digests
        run: docker buildx imagetools create ${{ steps.tags.outputs.tags }} $(printf "$IMAGE@sha256:%s " *)
      - run: docker buildx imagetools inspect "$IMAGE:$MAJOR-trixie"
