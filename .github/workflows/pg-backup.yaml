name: pg-backup

on:
  push:
    branches: [main]
    paths: [pg-backup.Dockerfile, pg-backup, .github/workflows/pg-backup.yaml]
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if nothing upstream changed
        type: boolean
        default: false

concurrency:
  group: pg-backup
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/thekiharani/pg-backup
  MAJORS: "18 19"
  CLIENT_LABEL: com.github.thekiharani.postgresql-client.version
  RCLONE_LABEL: com.github.thekiharani.rclone.version
  BUILD_BASE_LABEL: com.github.thekiharani.build-base.digest
  GO_BASE_LABEL: com.github.thekiharani.go-base.digest

jobs:
  check:
    runs-on: ubuntu-26.04
    permissions:
      actions: write
      contents: write
      pull-requests: write
    outputs:
      majors: ${{ steps.decide.outputs.majors }}
      targets: ${{ steps.decide.outputs.targets }}
      sha_tag: ${{ steps.decide.outputs.sha_tag }}
      base: ${{ steps.upstream.outputs.base }}
      base_digest: ${{ steps.upstream.outputs.base_digest }}
      build_base: ${{ steps.upstream.outputs.build_base }}
      build_base_digest: ${{ steps.upstream.outputs.build_base_digest }}
      go_base: ${{ steps.upstream.outputs.go_base }}
      go_base_digest: ${{ steps.upstream.outputs.go_base_digest }}
      rclone: ${{ steps.upstream.outputs.pinned_rclone }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Scheduled workflows in public repos are disabled after 60 days without activity; enabling resets that.
      - run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/pg-backup.yaml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
      - id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(sed -nE 's/^ARG RUNTIME_BASE=(.+)$/\1/p' pg-backup.Dockerfile)
          build_base=$(sed -nE 's/^ARG BUILD_BASE=(.+)$/\1/p' pg-backup.Dockerfile)
          go_base=$(sed -nE 's/^ARG GO_BASE=(.+)$/\1/p' pg-backup.Dockerfile)
          {
            echo "base=$base"
            echo "base_digest=$(docker buildx imagetools inspect "$base" --format '{{json .Manifest}}' | jq -r .digest)"
            echo "build_base=$build_base"
            echo "build_base_digest=$(docker buildx imagetools inspect "$build_base" --format '{{json .Manifest}}' | jq -r .digest)"
            echo "go_base=$go_base"
            echo "go_base_digest=$(docker buildx imagetools inspect "$go_base" --format '{{json .Manifest}}' | jq -r .digest)"
            echo "latest_rclone=$(gh api repos/rclone/rclone/releases/latest --jq .tag_name | sed -E 's/^v//')"
            echo "pinned_rclone=$(sed -nE 's/^ARG RCLONE_VERSION=(.+)$/\1/p' pg-backup.Dockerfile)"
          } | tee -a "$GITHUB_OUTPUT"
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          FORCE: ${{ inputs.force }}
          BASE_DIGEST: ${{ steps.upstream.outputs.base_digest }}
          BUILD_BASE_DIGEST: ${{ steps.upstream.outputs.build_base_digest }}
          GO_BASE_DIGEST: ${{ steps.upstream.outputs.go_base_digest }}
          LATEST_RCLONE: ${{ steps.upstream.outputs.latest_rclone }}
          PINNED_RCLONE: ${{ steps.upstream.outputs.pinned_rclone }}
        run: |
          sha_tag=false
          latest_major=$(printf '%s\n' $MAJORS | sort -n | tail -1)

          sources_changed=false
          if [ "$EVENT" = push ]; then
            if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
              || ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- pg-backup.Dockerfile pg-backup; then
              sources_changed=true
              sha_tag=true
              echo "pg-backup.Dockerfile or pg-backup changed"
            fi
          fi

          if [ "$sources_changed" = false ] && [ -n "$LATEST_RCLONE" ] \
            && [ "$(printf '%s\n%s\n' "$PINNED_RCLONE" "$LATEST_RCLONE" | sort -V | tail -1)" != "$PINNED_RCLONE" ]; then
            branch="rclone-$LATEST_RCLONE"
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
              echo "rclone $LATEST_RCLONE is out; its pull request is already open"
            else
              git switch -q -c "$branch"
              sed -i -E "s/^ARG RCLONE_VERSION=.+$/ARG RCLONE_VERSION=$LATEST_RCLONE/" pg-backup.Dockerfile
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -qam "Bump rclone to $LATEST_RCLONE"
              git push -q origin "$branch"
              gh pr create --base "$GITHUB_REF_NAME" --head "$branch" \
                --title "Bump rclone to $LATEST_RCLONE" \
                --body "$(printf '%s\n' \
                  "rclone $LATEST_RCLONE is out; this image carries $PINNED_RCLONE." \
                  "Release notes: https://rclone.org/changelog/" \
                  "" \
                  "Merging compiles it with only the S3 and local backends, publishes \`$IMAGE\` for Postgres $MAJORS, and the hosts pull it.")"
              git switch -q -
              echo "rclone $PINNED_RCLONE -> $LATEST_RCLONE: opened a pull request"
            fi
          fi

          packages=$(curl -fsSL https://apt.postgresql.org/pub/repos/apt/dists/trixie-pgdg/main/binary-amd64/Packages.gz | gzip -dc)
          majors='[]'
          targets='{}'
          for major in $MAJORS; do
            latest_client=$(awk -v p="Package: postgresql-client-$major" '$0 == p {f=1} f && /^Version:/ {print $2; f=0}' <<< "$packages" | sort -V | tail -1)
            [ -n "$latest_client" ] || { echo "::error::PGDG has no postgresql-client-$major"; exit 1; }
            published=$(docker buildx imagetools inspect "$IMAGE:$major-trixie" --format '{{json .Image}}' 2>/dev/null \
              | jq -c '."linux/amd64".config.Labels // {}' || echo '{}')
            published_base_digest=$(jq -r '."org.opencontainers.image.base.digest" // ""' <<< "$published")
            published_build_base_digest=$(jq -r --arg l "$BUILD_BASE_LABEL" '.[$l] // ""' <<< "$published")
            published_go_base_digest=$(jq -r --arg l "$GO_BASE_LABEL" '.[$l] // ""' <<< "$published")
            published_client=$(jq -r --arg l "$CLIENT_LABEL" '.[$l] // ""' <<< "$published")
            published_rclone=$(jq -r --arg l "$RCLONE_LABEL" '.[$l] // ""' <<< "$published")

            build=$sources_changed
            if [ "$sources_changed" = false ]; then
              if [ "$BASE_DIGEST" != "$published_base_digest" ]; then
                build=true
                echo "$major: runtime base changed: ${published_base_digest:-none} -> $BASE_DIGEST"
              fi
              if [ "$BUILD_BASE_DIGEST" != "$published_build_base_digest" ]; then
                build=true
                echo "$major: build base changed: ${published_build_base_digest:-none} -> $BUILD_BASE_DIGEST"
              fi
              if [ "$GO_BASE_DIGEST" != "$published_go_base_digest" ]; then
                build=true
                echo "$major: go base changed: ${published_go_base_digest:-none} -> $GO_BASE_DIGEST"
              fi
              if [ "$latest_client" != "$published_client" ]; then
                build=true
                echo "$major: postgresql-client ${published_client:-none} -> $latest_client"
              fi
              if [ "$PINNED_RCLONE" != "$published_rclone" ]; then
                build=true
                echo "$major: published rclone ${published_rclone:-none} differs from $PINNED_RCLONE"
              fi
              if [ "$FORCE" = true ]; then
                build=true
                echo "$major: forced"
              fi
            fi

            echo "$major: build $build"
            if [ "$build" = true ]; then
              targets=$(jq -c --arg major "$major" --arg client "$latest_client" \
                --argjson latest "$([ "$major" = "$latest_major" ] && echo true || echo false)" \
                '. + {($major): {client: $client, latest: $latest}}' <<< "$targets")
              majors=$(jq -c --arg major "$major" '. + [$major]' <<< "$majors")
            fi
          done

          {
            echo "majors=$majors"
            echo "targets=$targets"
            echo "sha_tag=$sha_tag"
          } | tee -a "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.majors != '[]'
    strategy:
      fail-fast: false
      matrix:
        major: ${{ fromJSON(needs.check.outputs.majors) }}
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: pg-backup.Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            PG_MAJOR=${{ matrix.major }}
            RUNTIME_BASE=${{ needs.check.outputs.base }}@${{ needs.check.outputs.base_digest }}
            BUILD_BASE=${{ needs.check.outputs.build_base }}@${{ needs.check.outputs.build_base_digest }}
            GO_BASE=${{ needs.check.outputs.go_base }}@${{ needs.check.outputs.go_base_digest }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.base.name=${{ needs.check.outputs.base }}
            org.opencontainers.image.base.digest=${{ needs.check.outputs.base_digest }}
            ${{ env.BUILD_BASE_LABEL }}=${{ needs.check.outputs.build_base_digest }}
            ${{ env.GO_BASE_LABEL }}=${{ needs.check.outputs.go_base_digest }}
            ${{ env.CLIENT_LABEL }}=${{ fromJSON(needs.check.outputs.targets)[matrix.major].client }}
            ${{ env.RCLONE_LABEL }}=${{ needs.check.outputs.rclone }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=pg-backup-${{ matrix.major }}-${{ matrix.arch }}
          cache-to: type=gha,scope=pg-backup-${{ matrix.major }}-${{ matrix.arch }},mode=max
      - run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.major }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    needs: [check, build]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.check.outputs.majors != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        major: ${{ fromJSON(needs.check.outputs.majors) }}
    runs-on: ubuntu-26.04
    permissions:
      packages: write
    env:
      MAJOR: ${{ matrix.major }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.major }}-*
          path: /tmp/digests
          merge-multiple: true
      - working-directory: /tmp/digests
        run: |
          count=$(ls | wc -l)
          [ "$count" -eq 2 ] || { echo "::error::pg-backup $MAJOR has $count of 2 platform builds"; exit 1; }
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        env:
          LATEST: ${{ fromJSON(needs.check.outputs.targets)[matrix.major].latest }}
          SHA_TAG: ${{ needs.check.outputs.sha_tag }}
        run: |
          tags="-t $IMAGE:$MAJOR-trixie"
          if [ "$LATEST" = true ]; then
            tags="$tags -t $IMAGE:latest"
          fi
          if [ "$SHA_TAG" = true ]; then
            tags="$tags -t $IMAGE:$MAJOR-trixie-${GITHUB_SHA:0:7}"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - working-directory: /tmp/digests
        run: docker buildx imagetools create ${{ steps.tags.outputs.tags }} $(printf "$IMAGE@sha256:%s " *)
      - run: docker buildx imagetools inspect "$IMAGE:$MAJOR-trixie"
