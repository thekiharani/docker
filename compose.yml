name: noria

services:
  noria_mariadb:
    image: ${MARIADB_IMAGE}
    container_name: noria_mariadb
    restart: unless-stopped
    env_file: .env
    environment:
      MARIADB_ROOT_PASSWORD: ${DP_PASS}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DP_PASS}
    ports:
      - "${MARIADB_PORT}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 60s
      start_interval: 3s
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - norialabs

  noria_postgres:
    image: ${POSTGRES_IMAGE}
    container_name: noria_postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DP_PASS}
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 60s
      start_interval: 3s
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - norialabs

  noria_redis:
    image: ${REDIS_IMAGE}
    container_name: noria_redis
    restart: unless-stopped
    env_file: .env
    command: ["redis-server", "--requirepass", "${DP_PASS}"]
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${DP_PASS}", "ping"]
      interval: 60s
      start_period: 60s
      start_interval: 3s
      timeout: 10s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - norialabs

  noria_mailpit:
    image: ${MAILPIT_IMAGE}
    container_name: noria_mailpit
    restart: unless-stopped
    env_file: .env
    ports:
      - "${MAILPIT_PORT}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1035}:1025"
    volumes:
      - mailpit_data:/data
    networks:
      - norialabs

networks:
  norialabs:
    external: true

volumes:
  mariadb_data:
    name: noria_mariadb_data
    external: true
  postgres_data:
  redis_data:
  mailpit_data:
